/* ---------------- Monedas y tienda de formas ----------------
   Gratis: la forma base de cada personaje y los Kaio-ken sin Super Saiyajin. El resto se compra con monedas.
   Ritmo pensado: ~6 victorias al día ≈ 260 monedas → todas las formas de un personaje en unas 2 semanas. */
const PROG_KEY='kc_prog';
function cleanProg(p){const d={coins:0,own:{},day:'',wins:0,earned:0,nick:''};if(!p||typeof p!=='object')return d;
 const num=(v,max)=>Number.isFinite(v)?clamp(Math.floor(v),0,max):0;d.coins=num(p.coins,1e7);d.wins=num(p.wins,1e7);d.earned=Math.max(num(p.earned,1e8),d.coins);
 d.day=typeof p.day==='string'?p.day.slice(0,10):'';d.nick=typeof p.nick==='string'?p.nick.replace(/[^\p{L}\p{N} _.-]/gu,'').slice(0,14):'';
 if(p.own&&typeof p.own==='object')for(const k in p.own)if(/^[a-z0-9]{1,16}$/.test(k)&&Array.isArray(p.own[k]))d.own[k]=[...new Set(p.own[k].filter(n=>Number.isInteger(n)&&n>=0&&n<40))];return d;}
const prog=(()=>{try{const v=localStorage.getItem(PROG_KEY);if(v&&v.length<20000)return cleanProg(JSON.parse(v));}catch(e){}return cleanProg(null);})();

/* ---------------- Online fuera de Claude (iPhone, GitHub Pages): PeerJS ----------------
   Los dos dispositivos se conectan directamente (WebRTC); el servidor público de PeerJS solo los presenta usando el código de sala.
   Imita la interfaz de salas de Claude (presence / onPeers / leave) para que el resto del modo online no cambie.
   El primero que usa un código es el anfitrión; si el código ya está ocupado, se entra como invitado. */
const P2P={ok:()=>typeof window.Peer==='function',lobby:{presence(){return Promise.resolve();},onPeers(){},join:name=>p2pJoin(name)}};
function p2pOpts(){const o={debug:0};const q=new URLSearchParams(location.search).get('peer');if(q&&/^[\w.-]+:\d+$/.test(q)){const[h,pt]=q.split(':');Object.assign(o,{host:h,port:+pt,path:'/',secure:location.protocol==='https:'});}return o;}
function p2pJoin(name){return new Promise((res,rej)=>{
 const id='kaioken-clash-'+String(name).replace(/[^a-z0-9-]/g,'');let me={},other=null,cbs=[],errs=[],conn=null,peer=null,done=false;
 const emit=()=>{const peers=[{isMe:true,sameTab:true,presence:me,peer:'yo'}];if(other&&conn&&conn.open)peers.push({isMe:false,sameTab:false,presence:other,peer:conn.peer});cbs.forEach(c=>{try{c({peers});}catch(e){reportError(e);}});};
 const wire=c=>{conn=c;c.on('data',d=>{if(d&&typeof d==='object'&&d.p&&typeof d.p==='object'){other=d.p;emit();}});c.on('open',()=>{try{c.send({p:me});}catch(e){}emit();});c.on('close',()=>{if(conn===c){other=null;conn=null;emit();}});c.on('error',()=>{});};
 const room={presence(p){me=Object.assign({},me,p);if(conn&&conn.open){try{conn.send({p:me});}catch(e){}}return Promise.resolve();}, // como en las salas de Claude, cada presencia se suma a la anterior
  onPeers(cb,err){cbs.push(cb);if(err)errs.push(err);setTimeout(emit,0);},
  leave(){cbs=[];errs=[];try{conn&&conn.close();}catch(e){}try{peer&&peer.destroy();}catch(e){}return Promise.resolve();}};
 const keep=pr=>pr.on('disconnected',()=>{try{if(!pr.destroyed)pr.reconnect();}catch(e){}});
 const fail=e=>{if(!done){done=true;try{peer&&peer.destroy();}catch(_){}rej(e);}else if(e&&e.type!=='peer-unavailable')errs.forEach(c=>c(e));};
 const timer=setTimeout(()=>fail(new Error('timeout')),15000);
 peer=new Peer(id,p2pOpts());keep(peer);
 peer.on('open',()=>{done=true;clearTimeout(timer);res(room);});
 peer.on('connection',c=>{if(conn&&conn.open){c.close();return;}wire(c);});
 peer.on('error',e=>{if(e&&e.type==='unavailable-id'&&!done){try{peer.destroy();}catch(_){}
   peer=new Peer(undefined,p2pOpts());keep(peer);
   peer.on('open',()=>{done=true;clearTimeout(timer);wire(peer.connect(id,{reliable:true,serialization:'json'}));res(room);});
   peer.on('error',fail);}
  else fail(e);});});}

function applyHit(att,def,o){
 if(game.phase!=='fight'||def.state==='ko'||def.invuln>0)return false;

 const kind=o.kind;
 if(def.vanishW>0&&def.ki>=.5&&(kind==='light'||kind==='heavy'||kind==='blast')){def.ki-=.5;def.vanishW=0;def.teleportBehind(att);pop(def,'¡VANISH!','#9fe8ff');return false;}
 /* Gogeta esquiva por instinto (evade, también se suma al Ultra Instinto); no vale contra definitivos ni choques de energía */
 const dodge=(def.form.ui||0)+(def.ch.evade||0)*(def.form.ui?.5:1);
 if(dodge&&kind!=='ult'&&!game.struggle&&Math.random()<dodge){afterimage(def);const r=V3(-def.fwd().z,0,def.fwd().x);def.pos.addScaledVector(r,Math.random()<.5?2.5:-2.5);pop(def,'¡ESQUIVA!','#e8f0ff');sfx('tele');return false;}
 const R=att.power()/def.power();let dmg;
 if(R<=1/20){const bypass=(kind==='special'||kind==='ult')&&(o.full||att.finalEffort);
  if(!bypass){pop(def,'SIN EFECTO','#bbbbbb');sfx('tink');sparks(def.chest(),0xffffff,4,6,.2);return false;}
  dmg=o.base*.10;if(!o.full)att.finalEffort=false;pop(def,'¡ESFUERZO FINAL!','#ffd23a',true);}
 else{if(kind==='blast'&&R<=1/4){pop(def,'DESVIADO','#cccccc');sfx('tink');return'deflect';}
  dmg=o.base*clamp(Math.pow(R,.55),.02,40)*Math.max(.4,1-.06*att.comboHits);}
 if(att.ch.dmgMult)dmg*=att.ch.dmgMult;if(att.boss&&att.boss.dmgK)dmg*=att.boss.dmgK; // el dragón aguanta mucho pero pega menosif(def.ch.brolyPassive&&def.role!=='boss')dmg*=1-def.brolyK()*.3; // Vegito: +8 % de daño
 if((att.cpu&&(game.mode==='cpu'||(teamMode()&&!def.cpu)))||att.role==='boss')dmg*=DIFFS[game.diff].dmg; // la CPU pega menos en Fácil e Intermedio
 const guarding=def.state==='guard'&&!o.guardBreak&&facing(def,att);
 if(world.ringDef&&world.inRing(def))dmg*=.9;
 def.lastAtt=att;if(teamMode()&&def.cpu&&att.team!==def.team&&Math.random()<.35)def.opp=att;
 if(guarding){dmg*=.25;def.hp-=dmg;def.addKi(.05);sparks(def.chest(),0x9fd8ff,8,8,.3);sfx('block');def.vel.copy(def.pos.clone().sub(att.pos).normalize().multiplyScalar(o.knock?8:3));game.hitstop=2;
  if(game.mode==="train")def.hp=Math.max(1,def.hp);if(def.hp<=0)ko(def,att);else checkThresholds(def);return true;}
 if(o.guardBreak&&def.state==='guard')pop(def,'¡GUARDIA ROTA!','#ff8a3a');
 if(att.comboHits===0)att.comboDmg=0;att.comboDmg+=dmg;att.lastCombo=att.comboDmg;
 def.hp-=dmg;if(def.headHp)dragonHeadHit(def,att,dmg);if(game.mode==="train")def.hp=Math.max(1,def.hp);def.noHitT=0;att.comboHits++;att.comboT=1.2;att.addKi(kind==='light'?.1:.2);def.addKi(.08*(def.rage?1.3:1));
 const armor=(R<=1/2&&kind==='light')||def.role==="boss"; // los jefes no se aturden
 if(!armor||def.state==='transform')def.cancelActions();
 const cp=def.chest(),big=kind!=='light';
 sparks(cp,big?0xffe08a:0xffffff,big?16:9,big?18:11,big?.5:.32);
 if(big){ring(cp,0xffffff,2.2,.25,false,.2);speedLines(.22);}
 sfx(big?'hitH':'hitL',clamp(.6+Math.log10(Math.max(R,1))*.3,.6,1.4));
 game.hitstop=Math.max(game.hitstop,kind==='light'?3:kind==='heavy'?6:8);game.shake=Math.max(game.shake,big?.7:.25);
 if(R>=4&&big)pop(def,['¡BAKOOM!','¡DOOM!','¡KRAAK!'][Math.random()*3|0],'#ffffff',true);

  if(!dead)for(const r of world.rocks)if(r.alive&&Math.hypot(p.pos.x-r.x,p.pos.z-r.z)<r.r+p.r&&p.pos.y<r.top()&&p.pos.y>r.y0){dead=true;if(p.kind==='ball'){explosion(p.pos,p.r*1.4,p.color);destroyRock(r,p.pos);}else{sparks(p.pos,p.color,5,6,.3);r.chip=(r.chip||0)+1;if(r.chip>=4)destroyRock(r,p.pos);}break;}
  if(p.life>(p.kind==='ball'?6:3))dead=true;
  if(dead){fxGroup.remove(p.mesh);projs.splice(i,1);}}}
function updateBeams(dt,t){
 for(let i=beams.length-1;i>=0;i--){const b=beams[i];b.t+=dt;const o=b.owner,tgt=o.opp;

 if(isRoyale()){const p=f[0].state!=='ko'?f[0]:f.find(x=>x.team===0&&x.state!=='ko')||f[0];return[p,p.opp||f.find(x=>x.team!==p.team),0];}

 if(code==='F2'){PIX=PIX>=3?1:PIX+1;store.set('kc_pix',PIX);resize();return;}

 if(game.phase){
  if(game.phase==='over'&&game.online){if(code==='Escape')ACTIONS.toOnline();return;}

 if(menuState)menuKey(code);}
function menuKey(code){
 const L=['KeyA','ArrowLeft','P0LL','P1LL','P0B14','P1B14'],R=['KeyD','ArrowRight','P0LR','P1LR','P0B15','P1B15'],U=['KeyW','ArrowUp','P0LU','P1LU','P0B12','P1B12'],D=['KeyS','ArrowDown','P0LD','P1LD','P0B13','P1B13'];
 const OK=['KeyF','Enter','KeyJ','Numpad1','Space','P0B0','P1B0'],BACK=['Escape','Backspace','P0B1','P1B1'];
 if(menuState==='title'){if(code==='KeyC')openGuide('title');else goPlay();return;}
 if(menuState==='online'||menuState==='rank'){if(BACK.includes(code))toMainMenu();return;}
 if(menuState==='shop'){if(BACK.includes(code)){menuState='title';sfx('back');renderMenu();}return;}
 if(menuState==='mode'){if(L.includes(code)){msel=(msel+modeList().length-1)%modeList().length;sfx('sel');}else if(R.includes(code)){msel=(msel+1)%modeList().length;sfx('sel');}
  else if((U.includes(code)||D.includes(code))&&modeList()[msel].diff!=null){game.diff=(game.diff+(U.includes(code)?1:2))%3;sfx('sel');}
  else if(OK.includes(code)){confirmMode();return;}else if(BACK.includes(code)){toMainMenu();return;}renderMenu();return;}
 if(menuState==='guide'){
  if(guideMode!=='match'){if(OK.includes(code)||BACK.includes(code)){menuState='title';sfx('back');renderMenu();}return;}
  if(code==='Enter'){startFromGuide();return;}
  if(BACK.includes(code)){menuState='world';sfx('back');renderMenu();return;}
  if(code==='KeyF'||code==='P0B0'){gready[0]=true;sfx('ok');}else if((code==='KeyJ'||code==='Numpad1'||code==='P1B0')&&!solo()){gready[1]=true;sfx('ok');}
  if(gready[0]&&gready[1]){startFromGuide();return;}renderMenu();return;}
 if(menuState==='squad'){const sl=sq.list[sq.slot],n=CHARS.length,nv={KeyA:-1,ArrowLeft:-1,KeyD:1,ArrowRight:1,KeyW:-7,ArrowUp:-7,KeyS:7,ArrowDown:7};
  if(nv[code]!=null){let i=sl.c+nv[code];if(Math.abs(nv[code])===1)i=(i+n)%n;else if(i<0||i>=n)i=sl.c;sqSet(i);}
  else if(code==='KeyF'||code==='P0B0'){if(sq.slot<sq.list.length-1){sq.slot++;sfx('ok');}else{sqGo();return;}}
  else if(code==='KeyG'||code==='P0B1'){if(sq.slot>0){sq.slot--;sfx('back');}else{menuState='mode';sfx('back');}}
  else if(code==='KeyQ')sqForm(-1);else if(code==='KeyE')sqForm(1);else if(code==='KeyR')sqRand();
  else if(code==='Enter'){sqGo();return;}else if(code==='Escape'){menuState='mode';sfx('back');}
  else if(isRoyale()&&{KeyZ:1,KeyX:1,KeyC:1,KeyV:1}[code])sqSize({KeyZ:'0-',KeyX:'0+',KeyC:'1-',KeyV:'1+'}[code]);
  renderMenu();return;}
 if(menuState==='chars'){
  // cada jugador: elegir personaje → elegir forma inicial → listo. En modos de 1 jugador, 1P elige también al rival.
  const ctl=solo()&&pst[0]==='ready'?1:0;
  const nav=(p,d)=>{if(pst[p]==='char'){let i=cur[p];if(d==='l')i=(i+CHARS.length-1)%CHARS.length;if(d==='r')i=(i+1)%CHARS.length;if(d==='u')i=i-7>=0?i-7:i;if(d==='d')i=i+7<CHARS.length?i+7:i;cur[p]=i;sfx('sel');}
   else if(pst[p]==='form'){const n=CHARS[cur[p]].forms.length;if(d==='u'||d==='l')fsel[p]=(fsel[p]+n-1)%n;if(d==='d'||d==='r')fsel[p]=(fsel[p]+1)%n;sfx('sel');}};
  const ok=p=>{if(pst[p]==='char'){pst[p]='form';fsel[p]=0;lockMsg='';sfx('ok');}else if(pst[p]==='form'){if(humanSide(p)&&!owns(CHARS[cur[p]],fsel[p])){lockMsg='Forma bloqueada: cómprala en la TIENDA';sfx('back');return;}lockMsg='';pst[p]='ready';sfx('ok');}};

 if(menuState==='boss'){if(L.includes(code)){game.bossSel=(game.bossSel+BOSSES.length-1)%BOSSES.length;sfx('sel');}else if(R.includes(code)){game.bossSel=(game.bossSel+1)%BOSSES.length;sfx('sel');}
  else if(OK.includes(code)){clearBossPrev();menuState='world';sfx('ok');}else if(BACK.includes(code)){clearBossPrev();menuState='chars';pst=['form','form'];sfx('back');}renderMenu();return;}
 if(menuState==='world'){let rebuild=false;if(L.includes(code)){wsel=(wsel+2)%3;vsel=0;rebuild=true;sfx('sel');}else if(R.includes(code)){wsel=(wsel+1)%3;vsel=0;rebuild=true;sfx('sel');}

/* ---------------- Actualizaciones ----------------
   Solo si version.json define updateUrl (HTTPS). Se descarga un manifiesto JSON pequeño, se valida campo a campo
   y, si hay versión nueva, se muestra un enlace a la tienda oficial. Nunca se descarga ni ejecuta código. */
const semver=s=>typeof s==='string'&&/^\d{1,4}\.\d{1,4}\.\d{1,4}$/.test(s)?s.split('.').map(Number):null;
function newerThan(a,b){const x=semver(a),y=semver(b);if(!x||!y)return false;for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i];}return false;}
function safeHttps(u,allowedHost){try{const p=new URL(u);return p.protocol==='https:'&&(!allowedHost||p.host===allowedHost)?p.href:null;}catch(e){return null;}}
let updChecked=false;
async function checkUpdate(){if(updChecked)return;updChecked=true;const src=safeHttps(APP.updateUrl);if(!src||!navigator.onLine)return;
 try{const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),6000);const r=await fetch(src,{signal:ctl.signal,cache:'no-store',credentials:'omit',redirect:'error',referrerPolicy:'no-referrer'});clearTimeout(tm);
  if(!r.ok||!(r.headers.get('content-type')||'').includes('json'))return;const txt=await r.text();if(txt.length>4096)return;const m=JSON.parse(txt);
  if(!m||typeof m!=='object'||!newerThan(m.version,APP.version))return;
  const storeHost=safeHttps(APP.storeUrl)?new URL(APP.storeUrl).host:null;const link=safeHttps(m.url,storeHost)||safeHttps(APP.storeUrl);
  const box=$('#upd');if(!box)return;box.className='upd';box.textContent='';
  const t=document.createElement('div');t.textContent='Hay una versión nueva: '+m.version+(typeof m.notes==='string'?' · '+m.notes.slice(0,160):'');box.appendChild(t);
  if(link){const a=document.createElement('a');a.href=link;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Descargar desde la tienda oficial';box.appendChild(a);}}
 catch(e){/* sin conexión o manifiesto inválido: se ignora */}}
