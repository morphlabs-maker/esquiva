 const root=new THREE.Group(),chibi=new THREE.Group(),body=new THREE.Group();chibi.scale.setScalar(CHIBI);root.add(chibi);chibi.add(body);
 const J={},M={arms:{}};

 addPart(Sph(.17),mats.pants,J.hips,0,0,0).scale.set(1.15,.8,.92);

 addPart(capsule(.15,.15,.08),mats.top,J.torso,0,.1,0).scale.set(1.1,1,.85);

 addPart(new THREE.CylinderGeometry(.055,.062,.12,16),mats.skin,J.neck,0,.04,0);
 J.head=new THREE.Group();J.head.position.y=.07;J.head.scale.setScalar(HEADK);J.neck.add(J.head);
 M.headG=new THREE.Group();M.headG.position.y=.14;J.head.add(M.headG);
 M.head=addPart(new THREE.SphereGeometry(.17,32,24),mats.skin,M.headG,0,0,0,true,1.04);M.head.scale.set(1,1.04,.98);
 M.eyes=[];
 for(const s of[1,-1]){
  /* Cara estilo Dragon Ball: ojo almendrado, pupila pequeña, párpado marcado y ceja gruesa en ceño */
  const w=addPart(Sph(.042,20,14),mats.eye,M.headG,s*.066,-.004,.144,false);w.scale.set(1.15,.85,.45);w.rotation.z=s*.12;
  const p=addPart(Sph(.019,14,10),mats.pupil,M.headG,s*.058,-.006,.16,false);p.scale.set(.9,1.15,.45);
  addPart(Sph(.006,8,6),mats.shine,M.headG,s*.052,.004,.168,false);

  const b=addPart(Bx(.085,.024,.016),mats.hair,M.headG,s*.07,.07,.142,false);b.rotation.z=s*.34;
  M.eyes.push(w,p);
  if(ch.ears!==false)addPart(Sph(.032,12,10),mats.skin,M.headG,s*.168,-.005,0,true,1.08).scale.set(.55,1,.8);
 }
 addPart(Sph(.013,10,8),mats.skin,M.headG,0,-.04,.163,false);
 addPart(Bx(.042,.007,.01),mats.mouth,M.headG,0,-.085,.15,false);
 M.hairAnchor=new THREE.Group();M.hairAnchor.position.y=.14;J.head.add(M.hairAnchor);
 for(const s of[1,-1]){const L=s>0?'L':'R';
  const sh=new THREE.Group();sh.position.set(s*.27,.37,0);J.torso.add(sh);J['sh'+L]=sh;
  addPart(Sph(.085,18,14),mats.sleeve,sh,0,0,0);
  const up=addPart(capsule(.068,.06,.2),mats.sleeve,sh,0,-.1,0);
  const el=new THREE.Group();el.position.y=-.2;sh.add(el);J['el'+L]=el;
  const fo=addPart(capsule(.058,.052,.16),mats.skin,el,0,-.08,0);
  addPart(new THREE.CylinderGeometry(.068,.066,.06,16),mats.wrist,el,0,-.15,0);
  const wr=new THREE.Group();wr.position.set(0,-.17,0);el.add(wr);J['wr'+L]=wr;addPart(Sph(.078,18,14),mats.glove,wr,0,-.045,.005).scale.set(1,1.05,1.1);
  M.arms[L]=[up,fo];
  const hp=new THREE.Group();hp.position.set(s*.095,-.04,0);J.hips.add(hp);J['hip'+L]=hp;
  addPart(capsule(.088,.074,.18),mats.pants,hp,0,-.09,0);
  const kn=new THREE.Group();kn.position.y=-.2;hp.add(kn);J['kn'+L]=kn;

 }
 if(ch.chestNum){const e=new THREE.Mesh(new THREE.PlaneGeometry(.1,.1),new THREE.MeshBasicMaterial({map:numTex(ch.chestNum),transparent:true}));e.position.set(.1,.33,.19);e.rotation.y=.3;J.torso.add(e);}
 const model={root,body,J,M,mats,hairStyle:null,extras:[],extrasKey:'',cur:{},target:'idle',smear:0,smearSide:'R',tail:null,t:Math.random()*10};

 return model;
}
/* El dragón de tres cabezas tiene su propio esqueleto; el resto usa el modelo humanoide */
function makeModel(ch){return ch.model==='dragon'?buildDragonModel(ch):buildModel(ch);}
/* Mechón de pelo estilo Dragon Ball: base ancha y redondeada, cuerpo con volumen y punta roma (sin pinchos) */
function hairLock(r,len,tk){const pts=[],rt=r*(tk||.32);
 for(let i=0;i<=6;i++){const a=-Math.PI/2+i/6*Math.PI/2;pts.push(new THREE.Vector2(Math.max(1e-4,Math.cos(a)*r),Math.sin(a)*r*.5));}
 for(let i=1;i<=8;i++){const k=i/8;pts.push(new THREE.Vector2((r*(1-k)+rt*k)*(1+.18*Math.sin(k*Math.PI)),k*(len-rt)));}
 for(let i=1;i<=6;i++){const a=i/6*Math.PI/2;pts.push(new THREE.Vector2(Math.max(1e-4,Math.cos(a)*rt),len-rt+Math.sin(a)*rt));}
 return new THREE.LatheGeometry(pts,12);}
function setHair(model,style){
 if(model.hairStyle===style)return;model.hairStyle=style;
 const a=model.M.hairAnchor;while(a.children.length)a.remove(a.children[0]);
 const H=HAIR[style]||HAIR.none,mat=model.mats.hair;
 if(H.cap){const g=new THREE.SphereGeometry(H.cap===2?.212:.19,32,16,0,TAU,0,Math.PI*(H.cap===2?.6:.52));const m=addPart(g,mat,a,0,H.cap===2?-.005:.008,H.cap===2?-.012:-.018);m.rotation.x=H.cap===2?-.15:-.32;}
 for(const s of H.sp){const m=addPart(hairLock(s[6]*1.35,s[5],H.tip),mat,a,s[0],s[1],s[2]);m.rotation.set(s[3],0,s[4]);m.scale.set(1,1,.72);}
}

 const to=b.pos.clone().sub(a.pos);to.y=0;if(to.lengthSq()<.01)return false;to.normalize();const r=V3(-to.z,0,to.x),tp=a.pos.clone().addScaledVector(to,-5.2*a.giant).addScaledVector(r,-1.5).add(V3(0,2.2*a.giant,0));

function updateCamera(dt){if(game.f.length<2)return;
 if(duoPhone()&&game.phase!=='over'&&game.f.length===2){if(game.cine&&!game.cine.dlg)game.cine=null;game.split=true;duoCams(game.f[0],game.f[1],1-Math.exp(-6*dt));cam.position.copy(camA.position);cam.quaternion.copy(camA.quaternion);return;}const [a,b,extra]=camAnchors();if(!a||!b)return;const k=1-Math.exp(-6*dt);

  if(c.type==='transform'&&f0IsPlayerVsBoss(c.f)){ /* contra un jefe: la cámara se coloca del lado opuesto al jefe para que nunca lo atraviese */
   const f=c.f,B=bossF(),away=f.pos.clone().sub(B.pos);away.y=0;if(away.lengthSq()<.01)away.set(-1,0,0);away.normalize();const side=V3(-away.z,0,away.x),sy=f.sy(),sw=Math.sin((c.dur-c.t)*1.6)*.8;
   tp=f.pos.clone().addScaledVector(away,4.6).addScaledVector(side,1.4+sw).add(V3(0,1.2*sy+.4,0));look=f.pos.clone().add(V3(0,.95*sy,0));}
  else if(c.type==='lssj'){const f=c.f,k=1-c.t/c.dur,fw=f.fwd(),sy=f.sy(),rt=V3(-fw.z,0,fw.x);
   if(k<.55){tp=f.pos.clone().addScaledVector(fw,2.2*sy).addScaledVector(rt,.25*sy).add(V3(0,1.25*sy,0));look=f.pos.clone().add(V3(0,1.2*sy,0));} // primer plano de la cara
   else{const ang=f.face+.6+(k-.55)*1.5;tp=f.pos.clone().add(V3(Math.sin(ang)*8*sy,1.4*sy,Math.cos(ang)*8*sy));look=f.pos.clone().add(V3(0,1*sy,0));}}
  else if(c.type==='transform'||c.type==='victory'||c.type==='ko'){const f=c.f,ang=f.face+(c.type==='victory'?.4:.9+(c.dur-c.t)*1.4),d=(c.type==='victory'?3.4:4.4)*f.giant,sy=f.sy();tp=f.pos.clone().add(V3(Math.sin(ang)*d,1.2*sy+.3,Math.cos(ang)*d));look=f.pos.clone().add(V3(0,1.05*sy,0));}
  else if(c.type==='ult'){const f=c.f,fw=f.fwd(),rt=V3(-fw.z,0,fw.x);tp=f.pos.clone().addScaledVector(fw,-3*f.giant).addScaledVector(rt,-1.5*f.giant).add(V3(0,1.6*f.sy(),0));look=f.opp.chest();}
  else{const ab=b.pos.clone().sub(a.pos);ab.y=0;ab.normalize();const n=V3(-ab.z,0,ab.x).multiplyScalar(camSide);tp=c.point.clone().addScaledVector(n,13).add(V3(0,4,0));look=c.point.clone();}
  cam.position.lerp(tp,1-Math.exp(-7*dt));camLook.lerp(look,1-Math.exp(-7*dt));game.split=false;}
 else if(on3D()&&cam3D(dt)){if(c)game.cine=null;game.split=false;}
 else if(royaleChase(a,b,k)){if(c)game.cine=null;game.split=false;}
 else{if(c)game.cine=null;
  const mid=a.pos.clone().add(b.pos).multiplyScalar(.5),sep=a.pos.distanceTo(b.pos)+extra;if(bossMode())mid.y+=b.giant*.5;else{const g=Math.max(a.giant,b.giant);if(g>1)mid.y+=g*.5;}
  game.split=sep>60&&game.phase==='fight'&&!bossMode()&&!teamMode()&&!game.online;
  if(game.split){for(const[f,cm]of[[a,camA],[b,camB]]){const to=f.opp.pos.clone().sub(f.pos).normalize();const r=V3(-to.z,0,to.x);const tp=f.pos.clone().addScaledVector(to,-5).addScaledVector(r,-1.4).add(V3(0,2,0));cm.position.lerp(tp,k);cm.lookAt(f.opp.chest());}}

  const cur=cam.position.clone().sub(mid);cur.y=0;if(cur.dot(n)<0&&cur.lengthSq()>1){n.multiplyScalar(-1);camSide=-1;}else camSide=1;
  const CZ=coarse?.72:.84,dy=Math.abs(a.pos.y-b.pos.y),dist=(3.6+sep*.52+dy*.3)*CZ;const tp=mid.clone().addScaledVector(n,dist).add(V3(0,1.5+sep*.09,0));

function menuKey(code){
 const L=['KeyA','ArrowLeft','P0LL','P1LL','P0B14','P1B14'],R=['KeyD','ArrowRight','P0LR','P1LR','P0B15','P1B15'],U=['KeyW','ArrowUp','P0LU','P1LU','P0B12','P1B12'],D=['KeyS','ArrowDown','P0LD','P1LD','P0B13','P1B13'];
 const OK=['KeyF','Enter','KeyJ','Numpad1','Space','P0B0','P1B0'],BACK=['Escape','Backspace','P0B1','P1B1'];
 if(menuState==='title'){if(code==='KeyC')openGuide('title');else if(code==='KeyH')ACTIONS.openStory();else goPlay();return;}
 if(menuState==='cine'){if(code==='Escape')cineEnd();else cineNext();return;}
 if(menuState==='wish'||menuState==='swish')return;
 if(menuState==='trainsel'){if(BACK.includes(code)){menuState='chars';pst=['form','ready'];sfx('back');renderMenu();}return;}
 if(['story','profile','chal','tdp'].includes(menuState)){if(BACK.includes(code)){if(menuState==='profile'&&profView!=='main'){profView='main';renderMenu();return;}toMainMenu();}return;}
 if(['smap','gallery','whatif'].includes(menuState)){if(BACK.includes(code)){if(menuState==='smap'&&book&&book.kind==='wi')menuState='whatif';else menuState='story';sfx('back');renderMenu();}return;}
 if(menuState==='online'||menuState==='rank'){if(BACK.includes(code))toMainMenu();return;}
 if(menuState==='shop'){if(BACK.includes(code)){menuState='title';sfx('back');renderMenu();}return;}
 if(menuState==='mode'){if(L.includes(code)){msel=(msel+modeList().length-1)%modeList().length;sfx('sel');}else if(R.includes(code)){msel=(msel+1)%modeList().length;sfx('sel');}
  else if((U.includes(code)||D.includes(code))&&modeList()[msel].diff!=null){game.diff=(game.diff+(U.includes(code)?1:DIFFS.length-1))%DIFFS.length;sfx('sel');}
  else if(OK.includes(code)){confirmMode();return;}else if(BACK.includes(code)){toMainMenu();return;}renderMenu();return;}
 if(menuState==='guide'){
  if(guideMode!=='match'){if(OK.includes(code)||BACK.includes(code)){menuState='title';sfx('back');renderMenu();}return;}
  if(code==='Enter'){startFromGuide();return;}
  if(BACK.includes(code)){if(game.mode==='train'){menuState='chars';pst=['form','ready'];}else menuState='world';sfx('back');renderMenu();return;}
  if(code==='KeyF'||code==='P0B0'){gready[0]=true;sfx('ok');}else if((code==='KeyJ'||code==='Numpad1'||code==='P1B0')&&!solo()){gready[1]=true;sfx('ok');}
  if(gready[0]&&gready[1]){startFromGuide();return;}renderMenu();return;}
 if(menuState==='squad'){const sl=sq.list[sq.slot],n=CHARS.length,nv={KeyA:-1,ArrowLeft:-1,KeyD:1,ArrowRight:1,KeyW:-7,ArrowUp:-7,KeyS:7,ArrowDown:7};
  if(nv[code]!=null){let i=sl.c+nv[code];if(Math.abs(nv[code])===1)i=(i+n)%n;else if(i<0||i>=n)i=sl.c;sqSet(i);}
  else if(code==='KeyF'||code==='P0B0'){if(sq.slot<sq.list.length-1){sq.slot++;sfx('ok');}else{sqGo();return;}}
  else if(code==='KeyG'||code==='P0B1'){if(sq.slot>0){sq.slot--;sfx('back');}else{menuState='mode';sfx('back');}}
  else if(code==='KeyQ')sqForm(-1);else if(code==='KeyE')sqForm(1);else if(code==='KeyR')sqRand();
  else if(code==='Enter'){sqGo();return;}else if(code==='Escape'){menuState='mode';sfx('back');}
  else if(isRoyale()&&{KeyZ:1,KeyX:1,KeyC:1,KeyV:1}[code])sqSize({KeyZ:'0-',KeyX:'0+',KeyC:'1-',KeyV:'1+'}[code]);
  renderMenu();return;}
 if(menuState==='chars'){
  // cada jugador: elegir personaje → elegir forma inicial → listo. En modos de 1 jugador, 1P elige también al rival.
  const ctl=solo()&&pst[0]==='ready'?1:0;
  const nav=(p,d)=>{if(pst[p]==='char'){let i=cur[p];if(d==='l')i=(i+CHARS.length-1)%CHARS.length;if(d==='r')i=(i+1)%CHARS.length;if(d==='u')i=i-7>=0?i-7:i;if(d==='d')i=i+7<CHARS.length?i+7:i;cur[p]=i;sfx('sel');}
   else if(pst[p]==='form'){const n=CHARS[cur[p]].forms.length;if(d==='u'||d==='l')fsel[p]=(fsel[p]+n-1)%n;if(d==='d'||d==='r')fsel[p]=(fsel[p]+1)%n;sfx('sel');}};
  const ok=p=>{if(pst[p]==='char'){if(humanSide(p)&&lockedC(cur[p])){lockMsg=LOCK_MSG;sfx('back');return;}pst[p]='form';fsel[p]=0;lockMsg='';sfx('ok');}else if(pst[p]==='form'){if(humanSide(p)&&!owns(CHARS[cur[p]],fsel[p])){lockMsg='Forma bloqueada: cómprala en la TIENDA';sfx('back');return;}lockMsg='';pst[p]='ready';sfx('ok');}};
  const back=p=>{if(pst[p]==='ready'){pst[p]='form';sfx('back');return true;}if(pst[p]==='form'){pst[p]='char';sfx('back');return true;}return false;};
  const m1={KeyA:'l',KeyD:'r',KeyW:'u',KeyS:'d'},m2={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d'};
  if(m1[code])nav(ctl,m1[code]);
  else if(m2[code]&&!solo())nav(1,m2[code]);
  else if(code==='KeyF'||code==='P0B0'||(code==='Enter'&&solo()))ok(ctl);
  else if((code==='KeyJ'||code==='Numpad1'||code==='Enter'||code==='P1B0')&&!solo())ok(1);
  else if(code==='KeyG'||code==='P0B1'){if(solo()){if(!(ctl===1&&back(1)))if(!back(0)){menuState='mode';sfx('back');}}else if(!back(0)){menuState='mode';sfx('back');}}
  else if((code==='KeyK'||code==='Numpad2'||code==='P1B1')&&!solo())back(1);
  else if(code==='Escape'){menuState='mode';sfx('back');}
  else if(code.startsWith('P')){const pi=+code[1],c=code.slice(2),dm={LL:'l',LR:'r',LU:'u',LD:'d',B14:'l',B15:'r',B12:'u',B13:'d'};if(dm[c])nav(solo()?ctl:pi,dm[c]);else if(c==='B0'&&!solo())ok(pi);}
  if(pst[0]==='ready'&&pst[1]==='ready'){clearMenuModels();if(game.mode==='train'){openGuide('match');return;}menuState=bossMode()?'boss':'world';}
  renderMenu();return;}
 if(menuState==='boss'){if(L.includes(code)){game.bossSel=(game.bossSel+BOSSES.length-1)%BOSSES.length;sfx('sel');}else if(R.includes(code)){game.bossSel=(game.bossSel+1)%BOSSES.length;sfx('sel');}
  else if(OK.includes(code)){clearBossPrev();menuState='world';sfx('ok');}else if(BACK.includes(code)){clearBossPrev();menuState='chars';pst=['form','form'];sfx('back');}renderMenu();return;}
 if(menuState==='world'){let rebuild=false;if(L.includes(code)){wsel=(wsel+WORLDS.length-1)%WORLDS.length;vsel=0;rebuild=true;sfx('sel');}else if(R.includes(code)){wsel=(wsel+1)%WORLDS.length;vsel=0;rebuild=true;sfx('sel');}
  else if(U.includes(code)||D.includes(code)){vsel=1-vsel;rebuild=true;sfx('sel');}
  else if(OK.includes(code)){openGuide('match');return;}
  else if(BACK.includes(code)){if(teamMode()||game.mode==='duo')menuState='squad';else if(bossMode())menuState='boss';else{menuState='chars';pst=['form','form'];}sfx('back');}
  if(rebuild)setupMenuStage();renderMenu();return;}}

const semver=s=>typeof s==='string'&&/^\d{1,4}\.\d{1,4}\.\d{1,4}$/.test(s)?s.split('.').map(Number):null;
function newerThan(a,b){const x=semver(a),y=semver(b);if(!x||!y)return false;for(let i=0;i<3;i++){if(x[i]!==y[i])return x[i]>y[i];}return false;}

 chalTrack(ev,n,max);checkAchs();plusSave();}
function weekKey(){const d=new Date(),t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y=t.getUTCFullYear();return y+'W'+Math.ceil(((t-Date.UTC(y,0,1))/864e5+1)/7);}
function pickSeeded(pool,n,seed){const a=pool.slice(),out=[];let s=seed>>>0;while(out.length<n&&a.length){s=(Math.imul(s,1103515245)+12345)>>>0;out.push(a.splice(s%a.length,1)[0]);}return out;}
function activeChals(){const C=prog.chal,d=today(),w=weekKey();
 if(C.d!==d){C.d=d;for(const k in C.p)if(k[0]==='d')delete C.p[k];C.cl=C.cl.filter(k=>k[0]!=='d');}
 if(C.w!==w){C.w=w;for(const k in C.p)if(k[0]==='w')delete C.p[k];C.cl=C.cl.filter(k=>k[0]!=='w');}
 return[...pickSeeded(CHAL_POOL,3,parseInt(hash32('d'+d),36)).map(c=>Object.assign({key:'d:'+c.id,daily:1},c)),...pickSeeded(CHAL_WEEK,3,parseInt(hash32('w'+w),36)).map(c=>Object.assign({key:'w:'+c.id},c))];}
function chalTrack(ev,n,max){for(const c of activeChals()){if(c.ev!==ev||prog.chal.cl.includes(c.key))continue;const cur=prog.chal.p[c.key]||0,nv=Math.min(c.n,c.max||max?Math.max(cur,n):cur+n);
  if(nv>=c.n&&cur<c.n)toast('✅ DESAFÍO COMPLETADO',c.txt+' · reclama '+c.c+' 🪙');prog.chal.p[c.key]=nv;}}
const chalDone=c=>(prog.chal.p[c.key]||0)>=c.n;
const chalReady=()=>activeChals().filter(c=>chalDone(c)&&!prog.chal.cl.includes(c.key)).length;

/* ---------------- Fusiones (solo parejas válidas, en peleas por equipos o contra jefes) ---------------- */
function fusionFor(f,p){const ids=[f.ch.id,p.ch.id];const m=FUSIONS.filter(x=>(x.a===ids[0]&&x.b===ids[1])||(x.a===ids[1]&&x.b===ids[0]));if(!m.length)return null;return m.find(x=>x.by===f.ch.id)||m[0];}
function fusionPartner(f){if(!game.phase||game.phase!=='fight'||f.state==='ko'||f.fused||game.story&&game.story.noFusion)return null;
 return game.f.find(p=>p!==f&&p.team===f.team&&p.role==='p'&&p.state!=='ko'&&!p.fused&&p.pos.distanceTo(f.pos)<12&&fusionFor(f,p))||null;}
function tryFuse(f){const p=fusionPartner(f);if(!p){const anyAlly=game.f.some(x=>x!==f&&x.team===f.team&&x.role==='p');pop(f,anyAlly?'Sin pareja de fusión válida':'Necesitas un aliado','#aaa');return;}
 const F=fusionFor(f,p),ci2=chIdx(F.r);if(ci2<0)return;const i=game.f.indexOf(f),hpK=clamp((f.hp/f.maxHp+p.hp/p.maxHp)/2*1.25,.3,1);
 const z=new Fighter(f.idx,ci2,{team:f.team,maxHp:Math.max(f.maxHp,p.maxHp),startForm:0});z.cpu=f.cpu;z.fused=true;z.opp=f.opp;
 const mid=f.pos.clone().add(p.pos).multiplyScalar(.5);z.reset(f.idx===0?-1:1,mid);z.hp=z.maxHp*hpK;z.ki=KIMAX;z.face=f.face;
 for(const x of game.f){if(x.opp===f||x.opp===p)x.opp=z;}
 game.f[i]=z;game.f.splice(game.f.indexOf(p),1);f.dispose();p.dispose();
 buildHud();game.f.forEach(x=>hudPortrait(x));flashScreen(.6);ring(z.chest(),0xffe08a,12,.7,true);sparks(z.chest(),0xffe08a,30,20,.6);sfx('flash');game.shake=2;
 showMsg('¡FUSIÓN!',F.how+' → '+z.ch.name,1.4);pop(z,z.ch.name.toUpperCase(),'#ffd23a',true);if(human(z))track('fusion');}
function fusionTick(){const can=[false,false];for(const f of game.f){if(!human(f)||f.state==='ko')continue;const key=f.idx===0?'KeyZ':'KeyN';

/* =========================================================
   MODO HISTORIA «JUNTO A GOKU» · ¿QUÉ PASARÍA SI…? · ESFERAS DEL DRAGÓN · GALERÍA
   Cada arco es un archivo de datos (story/<id>.js) que se descarga la primera vez que se abre y queda guardado
   para jugar sin internet (lo guarda el service worker). El archivo llama a KC_STORY({...}).
   Nodo de mapa: t='cine' (escena), t='fight' (pelea con condiciones) o t='db' (Esfera del Dragón escondida).
   ========================================================= */
const STORY={};window.KC_STORY=d=>{if(d&&typeof d.id==='string')STORY[d.id]=d;};
const storyLoading={};
function loadStory(id,file){if(STORY[id])return Promise.resolve(STORY[id]);if(storyLoading[id])return storyLoading[id];
 return storyLoading[id]=new Promise((ok,no)=>{const s=document.createElement('script');s.src=file;s.onload=()=>{delete storyLoading[id];STORY[id]?ok(STORY[id]):no(new Error('vacío'));};
  s.onerror=()=>{delete storyLoading[id];s.remove();no(new Error('sin conexión'));};document.head.appendChild(s);});}
const arcFile=id=>id==='whatif'?WHATIF_FILE:(ARCS.find(a=>a.id===id)||{}).file;
const cached={};
function checkCached(){if(!window.caches)return;for(const a of ARCS.concat([{id:'whatif',file:WHATIF_FILE}]))caches.match(a.file,{ignoreSearch:true}).then(r=>{const v=!!r;if(cached[a.id]!==v){cached[a.id]=v;if(menuState==='story')renderMenu();}}).catch(()=>{});}
function downloadAll(){const L=ARCS.map(a=>a.file).concat([WHATIF_FILE]);let n=0;storyMsg='Descargando…';renderMenu();
 Promise.all(L.map(f=>fetch(f,{cache:'no-cache'}).then(r=>{if(r.ok)n++;}).catch(()=>{}))).then(()=>{storyMsg=n===L.length?'✔ Todos los arcos guardados: ya puedes jugar sin internet.':'Faltan '+(L.length-n)+' arcos: conéctate a internet y vuelve a intentarlo.';setTimeout(checkCached,600);renderMenu();});}

  if(non>=0&&(this.ki>=stepCost(fs[non],this)||kk<0))return non;return kk;}

const go=()=>{try{if(sessionStorage.getItem('kc_upd')===V+'>'+pend)return;sessionStorage.setItem('kc_upd',V+'>'+pend);}catch(e){}location.reload();};
const chk=()=>{if(reg)reg.update().catch(()=>{});fetch('version.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j&&j.v&&j.v!==V){pend=j.v;if(!busy())go();}}).catch(()=>{});};
addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(r=>{reg=r;}).catch(()=>{});setTimeout(chk,2500);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')chk();});setInterval(()=>{if(pend&&!busy())go();else chk();},60000);})();</script></body></html>
